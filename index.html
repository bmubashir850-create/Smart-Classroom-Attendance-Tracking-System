<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Classroom Attendance</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Smart Classroom</h1>
    <p>Attendance Tracking System</p>
</header>

<div class="container">

    <div class="top-section">
        <div>
            <h2>Attendance Dashboard</h2>
            <p id="currentDate"></p>
        </div>

        <button onclick="markAllPresent()">
            Mark All Present
        </button>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="card">
            <h3>Present</h3>
            <p id="presentStudents">0</p>
        </div>

        <div class="card">
            <h3>Absent</h3>
            <p id="absentStudents">0</p>
        </div>

        <div class="card">
            <h3>Attendance %</h3>
            <p id="attendancePercentage">0%</p>
        </div>

    </div>

    <div class="add-student">

        <h2>Add Student</h2>

        <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
        >

        <input
            type="text"
            id="studentRoll"
            placeholder="Enter roll number"
        >

        <button onclick="addStudent()">
            Add Student
        </button>

    </div>

    <div class="attendance">

        <h2>Today's Attendance</h2>

        <input
            type="text"
            id="search"
            placeholder="Search student..."
            onkeyup="searchStudent()"
        >

        <table>

            <thead>
                <tr>
                    <th>Roll No.</th>
                    <th>Student Name</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
